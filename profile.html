<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Cloudbery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fffaf4;
    color: #29231f;
    font-family: 'Comfortaa', sans-serif;
}

header {
    height: 75px;
    background: white;
    border-bottom: 1px solid #f0e5da;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 7%;
}

.brand {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #e87525;
    font-size: 23px;
    font-weight: 700;
}

.brand img {
    width: 42px;
    height: 42px;
    object-fit: contain;
}

nav {
    display: flex;
    gap: 20px;
    align-items: center;
}

nav a {
    color: #75675d;
    text-decoration: none;
    font-size: 13px;
    font-weight: 700;
}

nav a:hover {
    color: #e87525;
}

.banner {
    height: 290px;
    background: linear-gradient(120deg, #e87525, #f5b16e);
    background-size: cover;
    background-position: center;
}

.profile {
    max-width: 900px;
    margin: -75px auto 25px;
    position: relative;
    padding: 0 30px 30px;
    background: white;
    border: 1px solid #f1e5d9;
    border-radius: 24px;
    box-shadow: 0 8px 30px rgba(83, 54, 30, 0.07);
    text-align: center;
}

.profile-picture {
    width: 150px;
    height: 150px;
    margin-top: -75px;
    border: 6px solid white;
    border-radius: 50%;
    object-fit: cover;
    background: #fffaf4;
}

.profile h1 {
    margin: 12px 0;
    font-size: 28px;
}

#bio {
    color: #75675d;
    font-size: 14px;
    line-height: 1.7;
}

.stats {
    display: flex;
    justify-content: center;
    gap: 35px;
    margin: 25px 0;
    color: #75675d;
    font-size: 13px;
}

.stats strong {
    color: #e87525;
    font-size: 19px;
    display: block;
    margin-bottom: 5px;
}

button {
    border: none;
    border-radius: 30px;
    padding: 13px 23px;
    background: #e87525;
    color: white;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #cf5f17;
    transform: translateY(-1px);
}

button.secondary {
    background: #fff1e5;
    color: #d76520;
}

button.secondary:hover {
    background: #ffe2ca;
}

.container {
    max-width: 900px;
    margin: 25px auto;
    padding: 30px;
    background: white;
    border: 1px solid #f1e5d9;
    border-radius: 22px;
}

.container h2 {
    margin: 0 0 22px;
    font-size: 21px;
}

input, textarea {
    width: 100%;
    padding: 15px;
    margin: 9px 0;
    border: 1px solid #eaded2;
    border-radius: 13px;
    background: #fffaf4;
    color: #29231f;
    font-family: inherit;
    font-size: 13px;
    outline: none;
}

input:focus, textarea:focus {
    border-color: #e87525;
}

textarea {
    min-height: 110px;
    resize: vertical;
}

#searchResults {
    margin-top: 12px;
}

#posts {
    margin-top: 20px;
}

.post {
    background: #fffaf4;
    border: 1px solid #f1e5d9;
    border-radius: 16px;
    padding: 20px;
    margin-top: 15px;
    overflow-wrap: anywhere;
}

footer {
    text-align: center;
    padding: 30px;
    color: #a99b90;
    font-size: 11px;
}

@media (max-width: 600px) {
    header {
        padding: 0 18px;
    }

    nav {
        gap: 12px;
    }

    nav a {
        font-size: 11px;
    }

    .brand {
        font-size: 18px;
    }

    .banner {
        height: 210px;
    }

    .profile {
        margin: -55px 12px 20px;
        padding: 0 18px 25px;
    }

    .profile-picture {
        width: 115px;
        height: 115px;
        margin-top: -58px;
    }

    .container {
        margin: 15px 12px;
        padding: 22px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <img src="cloudbery-logo.png" alt="Cloudbery">
        Cloudbery
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="feed.html">Feed</a>
        <a href="interests.html">Interests</a>
    </nav>
</header>

<div id="banner" class="banner"></div>

<section class="profile">

    <img
        id="profilePic"
        class="profile-picture"
        src="cloudbery-logo.png"
        alt="Profile picture"
    >

    <h1 id="cornerName">Loading profile...</h1>

    <p id="bio">No bio yet</p>

    <div class="stats">
        <div>
            <strong id="followers">0</strong>
            Followers
        </div>

        <div>
            <strong id="friends">0</strong>
            Friends
        </div>
    </div>

    <button class="secondary" onclick="logout()">Log Out</button>

</section>

<section class="container">
    <h2>Find People</h2>

    <input
        id="searchUsers"
        placeholder="Search Cloudbery users..."
        oninput="searchUsers()"
    >

    <div id="searchResults"></div>
</section>

<section class="container" id="settings">
    <h2>Profile Settings</h2>

    <p>About you</p>

    <textarea
        id="bioInput"
        placeholder="Tell people a little about yourself..."
    ></textarea>

    <button onclick="saveBio()">Save Bio</button>

    <p>Profile picture</p>

    <input
        type="file"
        accept="image/*"
        onchange="uploadProfile(event)"
    >

    <p>Profile banner</p>

    <input
        type="file"
        accept="image/*"
        onchange="uploadBanner(event)"
    >

    <p>Change username</p>

    <input
        id="nameInput"
        placeholder="New username"
    >

    <button onclick="saveProfile()">Save Username</button>
</section>

<section class="container" id="postBox">
    <h2>Create a Post</h2>

    <textarea
        id="postText"
        placeholder="What's happening?"
    ></textarea>

    <button onclick="createPost()">Publish Post</button>
</section>

<section class="container">
    <h2>Posts</h2>
    <div id="posts">
        Loading posts...
    </div>
</section>

<footer>
    © 2026 Cloudbery · Open-source social media
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
<script src="friend.js"></script>
<script src="friendcount.js"></script>
<script src="posts.js"></script>
<script src="profileview.js"></script>
<script src="bio.js"></script>
<script src="siteconfig.js"></script>

</body>
</html>
