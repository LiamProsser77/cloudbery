<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upload - Cloudbery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fffaf4;
    color: #29231f;
    font-family: 'Comfortaa', sans-serif;
}

header {
    height: 72px;
    background: white;
    border-bottom: 1px solid #f1e5d9;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    position: sticky;
    top: 0;
    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #e87525;
    font-size: 23px;
    font-weight: 700;
}

.brand img {
    width: 40px;
    height: 40px;
    object-fit: contain;
}

nav {
    display: flex;
    align-items: center;
    gap: 20px;
}

nav a {
    text-decoration: none;
    color: #75675d;
    font-size: 13px;
    font-weight: 700;
}

nav a:hover {
    color: #e87525;
}

main {
    max-width: 750px;
    margin: 45px auto;
    padding: 0 20px;
}

.page-title {
    margin-bottom: 25px;
}

.page-title h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

.page-title p {
    margin: 0;
    color: #8c7b6e;
    font-size: 13px;
}

.upload-panel {
    background: white;
    border: 1px solid #f1e5d9;
    border-radius: 20px;
    padding: 30px;
}

.upload-panel h2 {
    margin: 0 0 8px;
    font-size: 19px;
}

.upload-panel p {
    color: #8c7b6e;
    font-size: 12px;
    line-height: 1.6;
}

.upload-panel input {
    font-family: inherit;
}

.upload-panel input[type="file"] {
    display: block;
    width: 100%;
    margin: 15px 0;
    padding: 12px;
    border: 1px dashed #e5cbb5;
    border-radius: 12px;
    background: #fffaf4;
}

.upload-panel input[type="text"] {
    width: 100%;
    padding: 13px;
    border: 1px solid #eaded2;
    border-radius: 12px;
    background: #fffaf4;
    margin-bottom: 12px;
    outline: none;
}

.upload-panel input:focus {
    border-color: #e87525;
}

button {
    border: none;
    border-radius: 30px;
    padding: 13px 22px;
    background: #e87525;
    color: white;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #cf5f17;
}

#uploadStatus {
    font-size: 12px;
    color: #75675d;
    margin-top: 12px;
}

@media (max-width: 650px) {
    header {
        padding: 0 15px;
    }

    nav {
        gap: 11px;
    }

    nav a {
        font-size: 10px;
    }

    .brand {
        font-size: 18px;
    }

    .brand img {
        width: 32px;
        height: 32px;
    }

    main {
        padding: 0 13px;
        margin: 30px auto;
    }

    .upload-panel {
        padding: 22px;
    }
}
</style>
</head>

<body>

<header>
    <div class="brand">
        <img src="cloudbery-logo.png" alt="Cloudbery">
        Cloudbery
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="feed.html">Feed</a>
        <a href="profile.html">Profile</a>
    </nav>
</header>

<main>

    <div class="page-title">
        <h1>Upload a Video</h1>
        <p>Share a video with the Cloudbery community.</p>
    </div>

    <section class="upload-panel">

        <h2>Create a Video</h2>
        <p>Choose a video from your device and give it a title.</p>

        <input
            type="text"
            id="videoTitle"
            placeholder="Give your video a title..."
            maxlength="100"
        >

        <input
            type="file"
            id="videoFile"
            accept="video/*"
        >

        <button onclick="uploadVideo()">Upload Video</button>

        <div id="uploadStatus"></div>

    </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="videos.js"></script>

</body>
</html>
