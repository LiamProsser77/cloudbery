<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feed - Cloudbery</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #fffaf4;
    color: #29231f;
    font-family: 'Comfortaa', sans-serif;
}

header {
    min-height: 72px;
    background: white;
    border-bottom: 1px solid #f1e5d9;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    position: sticky;
    top: 0;
    z-index: 10;
}

.brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #e87525;
    font-size: 23px;
    font-weight: 700;
    text-decoration: none;
}

.brand img {
    width: 40px;
    height: 40px;
    object-fit: contain;
}

nav {
    display: flex;
    align-items: center;
    gap: 18px;
}

nav a {
    text-decoration: none;
    color: #75675d;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
}

nav a:hover {
    color: #e87525;
}

nav .upload-link {
    background: #e87525;
    color: white;
    padding: 11px 16px;
    border-radius: 25px;
}

nav .upload-link:hover {
    background: #cf5f17;
    color: white;
}

main {
    max-width: 1000px;
    margin: 30px auto;
    padding: 0 20px;
}

.page-title {
    margin-bottom: 25px;
}

.page-title h1 {
    margin: 0 0 8px;
    font-size: 28px;
}

.page-title p {
    margin: 0;
    color: #8c7b6e;
    font-size: 13px;
    line-height: 1.6;
}

.search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 30px;
}

input {
    font-family: inherit;
}

.search-box input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: 1px solid #eaded2;
    border-radius: 30px;
    background: white;
    outline: none;
}

.search-box input:focus {
    border-color: #e87525;
}

button {
    border: none;
    border-radius: 30px;
    padding: 13px 22px;
    background: #e87525;
    color: white;
    font-family: inherit;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #cf5f17;
}

.feed-heading {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    gap: 15px;
}

.feed-heading h2 {
    font-size: 21px;
    margin: 0;
}

.feed-heading select {
    padding: 10px;
    border: 1px solid #eaded2;
    border-radius: 12px;
    background: white;
    font-family: inherit;
    color: #75675d;
}

#videoFeed {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 22px;
}

.video-card {
    min-width: 0;
    background: white;
    border: 1px solid #f1e5d9;
    border-radius: 20px;
    overflow: hidden;
}

.video-card video {
    width: 100%;
    aspect-ratio: 9 / 12;
    display: block;
    background: #211c18;
    object-fit: contain;
}

.video-info {
    padding: 17px;
}

/* Video title and like button */

.video-title-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
}

.video-title-row h3 {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    margin: 0;
    overflow-wrap: anywhere;
}

.like-button {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
    flex-shrink: 0;
    padding: 5px 8px;
    border-radius: 20px;
    background: #fff4e9;
    color: #75675d;
    font-size: 11px;
}

.like-button:hover {
    background: #ffe6d1;
}

.like-button.liked {
    background: #ffe6d1;
    color: #e87525;
}

.like-button:disabled {
    cursor: default;
    opacity: 0.85;
}

.like-logo {
    width: 16px;
    height: 16px;
    object-fit: contain;
}

.like-count {
    font-size: 11px;
}

.creator {
    color: #e87525;
    font-size: 11px;
    font-weight: 700;
    margin: 9px 0 0;
}

#emptyFeed {
    grid-column: 1 / -1;
    background: white;
    border: 1px solid #f1e5d9;
    border-radius: 18px;
    padding: 35px 20px;
    text-align: center;
    color: #8c7b6e;
    font-size: 13px;
    line-height: 1.8;
}

footer {
    text-align: center;
    color: #a99b90;
    font-size: 11px;
    padding: 35px 15px;
}

@media (max-width: 650px) {
    header {
        padding: 12px 15px;
        flex-wrap: wrap;
        gap: 12px;
    }

    nav {
        gap: 12px;
        flex-wrap: wrap;
    }

    nav a {
        font-size: 10px;
    }

    nav .upload-link {
        padding: 9px 12px;
    }

    .brand {
        font-size: 18px;
    }

    .brand img {
        width: 32px;
        height: 32px;
    }

    main {
        padding: 0 13px;
    }

    #videoFeed {
        grid-template-columns: 1fr;
    }

    .search-box button {
        padding: 12px 15px;
    }
}
</style>
</head>

<body>

<header>
    <a class="brand" href="index.html">
        <img src="cloudbery-logo.png" alt="Cloudbery">
        Cloudbery
    </a>

    <nav>
        <a href="index.html">Home</a>
        <a href="feed.html">Feed</a>
        <a href="profile.html">Profile</a>
        <a href="upload.html" class="upload-link">Upload Video</a>
    </nav>
</header>

<main>

    <div class="page-title">
        <h1>Your Feed</h1>
        <p>Videos from everyone on Cloudbery.</p>
    </div>

    <div class="search-box">
        <input
            type="search"
            id="videoSearch"
            placeholder="Search video titles..."
            onkeydown="if(event.key === 'Enter') searchVideos()"
        >
        <button onclick="searchVideos()">Search</button>
    </div>

    <section>
        <div class="feed-heading">
            <h2>Discover Videos</h2>

            <select id="feedSort" onchange="loadVideos()">
                <option value="random">Random</option>
                <option value="newest">Newest</option>
            </select>
        </div>

        <div id="videoFeed">
            <div id="emptyFeed">
                Loading videos...
            </div>
        </div>
    </section>

</main>

<footer>
    © 2026 Cloudbery · Open-source social media
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="videos.js"></script>

</body>
</html>
